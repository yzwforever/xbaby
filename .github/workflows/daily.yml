name: daily

# 路线A：GitHub Actions 全自动。每天北京时间 21:30 首跑，22:35/23:35 补跑
#（当晚文字稿未上齐或首跑失败时自动补上；已完成的日期直接跳过，不重复调用模型）。
on:
  schedule:
    - cron: '30 13 * * *'
    - cron: '35 14 * * *'
    - cron: '35 15 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '指定日期 YYYY-MM-DD（留空=自动补跑）'
        required: false
        default: ''
      test_push:
        description: '只检查推送配置（不发送微信、不生成日报）'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEWSSTUDY_REMOTE_PERSIST: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.NEWSSTUDY_PUSH_PAT || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装中文字体与依赖
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-wqy-microhei
          python -m pip install -r requirements.txt
      - name: 准备配置
        run: cp config.actions.json config.json
      - name: 密钥自检（只看有无，不显示内容）
        env:
          NEWSSTUDY_COS_SECRET_ID: ${{ secrets.NEWSSTUDY_COS_SECRET_ID }}
          NEWSSTUDY_COS_SECRET_KEY: ${{ secrets.NEWSSTUDY_COS_SECRET_KEY }}
          NEWSSTUDY_MODEL_API_KEY: ${{ secrets.NEWSSTUDY_MODEL_API_KEY }}
          NEWSSTUDY_SERVERCHAN_SENDKEY: ${{ secrets.NEWSSTUDY_SERVERCHAN_SENDKEY }}
        run: |
          for v in NEWSSTUDY_MODEL_API_KEY NEWSSTUDY_SERVERCHAN_SENDKEY NEWSSTUDY_COS_SECRET_ID NEWSSTUDY_COS_SECRET_KEY; do
            val="${!v}"
            if [ -n "$val" ]; then echo "$v: 已配置（${#val} 字符）"; else echo "$v: 【空！未取到】"; fi
          done
      - name: 配置提交身份
        run: |
          git config user.name "newsstudy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: 恢复并确认远端投递状态
        id: prepare
        if: github.event.inputs.test_push != 'true'
        run: python -m newsstudy prepare-state
      - name: 检查推送配置（不发送）
        if: github.event.inputs.test_push == 'true'
        env:
          KEYS: ${{ secrets.NEWSSTUDY_SERVERCHAN_SENDKEY }}
        run: |
          python - <<'EOF'
          import os, re
          keys = [k.strip() for k in os.environ.get('KEYS', '').split(',') if k.strip()]
          if not keys or any(not re.fullmatch(r'SCT[A-Za-z0-9]+|sctp\d+t[A-Za-z0-9]+', k) for k in keys):
              raise SystemExit('推送配置缺失或格式无效（不显示内容）')
          print(f'配置格式有效，共 {len(set(keys))} 个接收人；未发送微信。')
          EOF
      - name: 生成日报
        if: github.event.inputs.test_push != 'true'
        id: run
        env:
          REQUESTED_DATE: ${{ inputs.date }}
          NEWSSTUDY_MODEL_API_KEY: ${{ secrets.NEWSSTUDY_MODEL_API_KEY }}
          NEWSSTUDY_SERVERCHAN_SENDKEY: ${{ secrets.NEWSSTUDY_SERVERCHAN_SENDKEY }}
          NEWSSTUDY_COS_SECRET_ID: ${{ secrets.NEWSSTUDY_COS_SECRET_ID }}
          NEWSSTUDY_COS_SECRET_KEY: ${{ secrets.NEWSSTUDY_COS_SECRET_KEY }}
          NEWSSTUDY_REPO_PDF_BASE_URL: https://github.com/${{ github.repository }}/blob/HEAD
          NEWSSTUDY_REPO_CDN_BASE_URL: https://cdn.jsdelivr.net/gh/${{ github.repository }}@main
        run: |
          if [ -n "$REQUESTED_DATE" ]; then
            python -m newsstudy run --date "$REQUESTED_DATE"
          else
            python -m newsstudy run
          fi
      # 不提交 SQLite、锁文件或日志；失败后仍保存已产生的安全记录。
      - name: 保存日报产物与安全投递状态
        if: always() && !cancelled() && steps.prepare.outcome == 'success'
        env:
          NEWSSTUDY_COS_SECRET_ID: ${{ secrets.NEWSSTUDY_COS_SECRET_ID }}
          NEWSSTUDY_COS_SECRET_KEY: ${{ secrets.NEWSSTUDY_COS_SECRET_KEY }}
          NEWSSTUDY_MODEL_API_KEY: ${{ secrets.NEWSSTUDY_MODEL_API_KEY }}
          NEWSSTUDY_SERVERCHAN_SENDKEY: ${{ secrets.NEWSSTUDY_SERVERCHAN_SENDKEY }}
        run: python -m newsstudy sync-state
